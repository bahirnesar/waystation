<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Outer Atmospheric Halo Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#2563eb" stop-opacity="0.9" />
      <stop offset="84%" stop-color="#1d4ed8" stop-opacity="0.6" />
      <stop offset="92%" stop-color="#1e3a8a" stop-opacity="0.28" />
      <stop offset="98%" stop-color="#172554" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Globe Sphere Base Gradient -->
    <radialGradient id="globeBase" cx="38%" cy="34%" r="66%">
      <stop offset="0%" stop-color="#0d1426" />
      <stop offset="42%" stop-color="#060914" />
      <stop offset="85%" stop-color="#020308" />
      <stop offset="100%" stop-color="#000103" />
    </radialGradient>

    <!-- Inner Atmospheric Limb (Fresnel glow hugging the edge) -->
    <radialGradient id="innerLimb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0" />
      <stop offset="70%" stop-color="#000" stop-opacity="0" />
      <stop offset="84%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="93%" stop-color="#3b82f6" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.95" />
    </radialGradient>

    <!-- Rim highlight stroke -->
    <linearGradient id="rimGrad" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Globe Clip Circle -->
    <clipPath id="globeClip">
      <circle cx="32" cy="32" r="25" />
    </clipPath>
  </defs>

  <!-- 1. Outer Atmospheric Halo -->
  <circle cx="32" cy="32" r="31.5" fill="url(#haloGlow)" />

  <!-- 2. Dark Globe Base -->
  <circle cx="32" cy="32" r="25" fill="url(#globeBase)" />

  <!-- 3. Graticules & Continents (clipped to globe) -->
  <g clip-path="url(#globeClip)" transform="rotate(-18 32 32)">
    <!-- Continents / Landmass silhouettes -->
    <!-- Eurasia & Africa -->
    <path d="M 27 16 Q 34 14 39 17 Q 45 20 46 27 Q 44 33 38 34 Q 34 36 33 39 Q 32 46 29 48 Q 26 44 27 36 Q 24 34 21 31 Q 22 23 25 20 Z" 
          fill="#142138" stroke="#2c3e5e" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Asia East / Pacific Islands -->
    <path d="M 43 21 Q 49 22 52 28 Q 50 35 46 34 Q 45 27 42 24 Z" 
          fill="#142138" stroke="#2c3e5e" stroke-width="0.7" stroke-linejoin="round" />
    <!-- Americas (West edge) -->
    <path d="M 14 18 Q 18 21 17 28 Q 13 34 15 39 Q 18 43 15 48 Q 12 43 12 33 Q 11 25 13 19 Z" 
          fill="#142138" stroke="#2c3e5e" stroke-width="0.7" stroke-linejoin="round" />

    <!-- Graticules / Grid Lines -->
    <!-- Latitudes -->
    <ellipse cx="32" cy="17" rx="20.5" ry="4.5" fill="none" stroke="#22334f" stroke-width="0.7" stroke-dasharray="1.2 1.4" opacity="0.85" />
    <ellipse cx="32" cy="24" rx="23.8" ry="5.2" fill="none" stroke="#2b3e60" stroke-width="0.8" opacity="0.85" />
    <ellipse cx="32" cy="32" rx="25" ry="5.6" fill="none" stroke="#3b527e" stroke-width="0.9" opacity="0.85" />
    <ellipse cx="32" cy="40" rx="23.8" ry="5.2" fill="none" stroke="#2b3e60" stroke-width="0.8" opacity="0.85" />
    <ellipse cx="32" cy="47" rx="20.5" ry="4.5" fill="none" stroke="#22334f" stroke-width="0.7" stroke-dasharray="1.2 1.4" opacity="0.85" />

    <!-- Longitudes -->
    <ellipse cx="32" cy="32" rx="8.8" ry="25" fill="none" stroke="#2b3e60" stroke-width="0.8" opacity="0.85" />
    <ellipse cx="32" cy="32" rx="17" ry="25" fill="none" stroke="#22334f" stroke-width="0.7" opacity="0.85" />
    <line x1="32" y1="7" x2="32" y2="57" stroke="#3b527e" stroke-width="0.9" opacity="0.85" />
  </g>

  <!-- 4. Inner Atmospheric Limb / Horizon Glow -->
  <circle cx="32" cy="32" r="25" fill="url(#innerLimb)" />

  <!-- 5. Fine Horizon Rim Stroke -->
  <circle cx="32" cy="32" r="24.8" fill="none" stroke="url(#rimGrad)" stroke-width="0.8" />
</svg>