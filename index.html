<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAYSTATION</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/main.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FAF6F0;
      color: #1E1B18;
      overflow: hidden;
      font-family: 'IBM Plex Mono', monospace, sans-serif;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background-color: #FAF6F0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s ease;
      pointer-events: all;
      user-select: none;
      -webkit-user-select: none;
    }

    #loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-progress-bar {
      width: 140px;
      height: 8px;
      background: #FFFDF9;
      border: 2px solid #1E1B18;
      box-shadow: 2px 2px 0px #1E1B18;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .loading-progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 35%;
      background: #F4977C;
      border-radius: 999px;
      animation: loading-sweep 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes loading-sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(380%); }
    }
  </style>

  <script src="/locations_data.js"></script>
  <script src="/tracks_data.js"></script>
  <script src="/stations_data.js"></script>
  <script src="https://www.youtube.com/iframe_api" async></script>
  <script src="https://w.soundcloud.com/player/api.js" async></script>
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
</head>

<body>

  <!-- Initial Loading Screen -->
  <div id="loading-screen" aria-label="Loading Waystation">
    <div class="loading-progress-bar">
      <div class="loading-progress-bar-fill"></div>
    </div>
  </div>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-pill">
      <img class="tooltip-art" id="ttArt" style="display:none" alt="">
      <div class="tooltip-text">
        <div class="tooltip-title" id="ttTitle"></div>
        <div class="tooltip-sub" id="ttSub"></div>
      </div>
    </div>
    <div class="tooltip-arrow"></div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close icon-close-btn" id="detailClose"></button>
    <div id="detailContent"></div>
  </div>

  <!-- Stations Panel -->
  <div class="sector-panel" id="sectorPanel">
    <div class="sector-panel-header">
      <div class="sector-panel-title">Stations</div>
      <div class="sector-panel-actions">
        <button class="station-hdr-btn" id="stationCreateBtn" title="Create New Station">+ Station</button>
        <button class="station-hdr-btn import" id="stationImportBtn" title="Import Tracks to Station">Import</button>
      </div>
    </div>
    <input type="text" class="sector-search-input" id="sectorSearchInput" placeholder="Search stations..."
      autocomplete="off">
    <div class="sector-list" id="sectorList"></div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="logo" id="logoBtn" title="Switch or Create Room">
      <svg class="logo-mark" width="14" height="14" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8.5" fill="#FFFDF9" stroke="#1E1B18" stroke-width="5" />
      </svg>
      <span class="logo-text" id="headerTitle">WAYSTATION</span>
    </div>

    <button class="room-view-btn" id="roomViewBtn" type="button" title="Reset Camera &amp; Start Autopilot">
      <span class="room-view-text" id="roomViewTitle">OSTALGIE</span>
    </button>

    <div class="nav-stats">
      <div class="nav-stat"><span class="nav-stat-label">Tracks</span><span class="nav-stat-value" id="hudTracks">1,080</span></div>
      <div class="nav-stat"><span class="nav-stat-label">Artists</span><span class="nav-stat-value" id="hudArtists">640</span></div>
    </div>

    <div class="search-wrap">
      <input type="text" class="search-box" id="searchInput" placeholder="Search..." autocomplete="off">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M10 10l4 4m0-4l-4 4" />
        </svg>
      </button>
    </div>

    <!-- Search Results Dropdown -->
    <div class="search-results" id="searchResults">
      <div class="sr-browse-bar" id="srBrowseBar">
        <span class="sr-browse-count" id="srBrowseCount">1080 tracks</span>
      </div>
      <div class="sr-body" id="srBody"></div>
    </div>

    <!-- Room, Stations, Import & Info Buttons -->
    <button class="sector-btn" id="roomPanelBtn" title="Room"><span class="btn-icon room-btn-icon"></span>
      Room</button>
    <button class="sector-btn" id="sectorBtn" title="Manage Stations"><span class="btn-icon sector-btn-icon"></span>
      Stations</button>
    <button class="sector-btn" id="importBtn" title="Import Music"><span class="btn-icon import-btn-icon"></span>
      Import</button>
    <button class="info-btn" id="infoBtn" title="Info & Controls"></button>
  </div>

  <!-- Info Panel -->
  <div class="info-panel" id="infoPanel">
    <button class="info-panel-close icon-close-btn" id="infoPanelClose"></button>

    <div class="info-panel-header">
      <div class="info-panel-title">CONTROLS &amp; HOTKEYS</div>
    </div>

    <!-- Controls -->
    <div class="info-tab-content" id="viewInfoControls">
      <p style="color:var(--text-muted);margin-bottom:6px">Hover to preview, click a hub or track to focus. Drag to orbit,
        scroll to zoom.</p>
      <div class="info-controls">
        <div class="info-ctrl-row" id="ctrlAutopilot">
          <div class="info-ctrl-check on" id="checkAutopilot"></div>
          <span class="info-ctrl-label">Auto-pilot</span>
          <span class="info-ctrl-key">Enter</span>
        </div>
        <div class="info-ctrl-row" id="ctrlBorders">
          <div class="info-ctrl-check on" id="checkBorders"></div>
          <span class="info-ctrl-label">Land borders</span>
          <span class="info-ctrl-key">B</span>
        </div>
        <div class="info-ctrl-row" id="ctrlStarfield">
          <div class="info-ctrl-check" id="checkStarfield"></div>
          <span class="info-ctrl-label">Dark mode</span>
          <span class="info-ctrl-key">N</span>
        </div>
        <div class="info-ctrl-row" id="ctrlSounds">
          <div class="info-ctrl-check on" id="checkSounds"></div>
          <span class="info-ctrl-label">Sound Effects</span>
          <span class="info-ctrl-key">M</span>
        </div>
        <div class="info-ctrl-row" id="ctrlResetCam">
          <div class="info-ctrl-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4" />
              <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
            </svg>
          </div>
          <span class="info-ctrl-label">Reset camera</span>
          <span class="info-ctrl-key">V</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hovering Player Widget -->
  <div class="player-bar" id="playerBar">
    <div class="player-left" id="playerLeft">
      <div class="player-art-placeholder" id="playerArt"></div>
    </div>
    <div class="player-right">
      <div class="player-info" id="playerInfo">
        <div class="player-title" id="playerTitle">No track selected</div>
        <div class="player-artist" id="playerArtist"><span class="plat-dot" id="playerPlatDot"></span><span id="playerArtistText">Click a node to play</span></div>
      </div>
      <div class="player-progress" id="pProgress">
        <div class="player-time"><span id="pTime">0:00</span><span id="pDur">0:00</span></div>
        <div class="player-progress-bar" id="pBar">
          <div class="player-progress-ghost" id="pGhost"></div>
          <div class="player-progress-fill" id="pFill"></div>
          <div class="player-progress-livedot" id="pLiveDot"></div>
          <div class="player-progress-livetime" id="pLiveTime">0:00</div>
          <div class="player-progress-tooltip" id="pTooltip">0:00</div>
          <div class="player-progress-hitarea" id="pHitarea"></div>
        </div>
      </div>
      <div class="player-controls">
        <div class="player-controls-left">
          <button class="p-btn" id="pPrev" title="Previous"></button>
          <button class="p-btn main" id="pToggle" title="Play"></button>
          <button class="p-btn" id="pNext" title="Next"></button>
        </div>
        <div class="player-controls-right">
          <button class="shuffle-btn" id="shuffleBtn" title="Shuffle"></button>
          <div class="vol-wrap" id="volWrap">
            <button class="p-btn" id="volBtn" title="Volume"></button>
            <div class="vol-popup" id="volPopup">
              <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="50">
              <div class="vol-pct" id="volPct">50%</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Media Player Containers (YouTube, SoundCloud, Spotify) -->
  <div id="yt-player-wrap"
    style="position:fixed;bottom:0;left:0;width:200px;height:200px;opacity:0.001;pointer-events:none;z-index:-10;">
    <div id="yt-frame"></div>
  </div>
  <div id="sc-player-wrap"
    style="position:fixed;bottom:0;left:0;width:10px;height:10px;opacity:0.0001;pointer-events:none;z-index:-10;">
    <iframe id="sc-frame" width="10" height="10" scrolling="no" frameborder="no" allow="autoplay"
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&amp;auto_play=false"></iframe>
  </div>
  <div id="spotify-player-wrap"
    style="position:fixed;bottom:0;left:0;width:10px;height:10px;opacity:0.0001;pointer-events:none;z-index:-10;">
    <div id="spotify-embed"></div>
  </div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
